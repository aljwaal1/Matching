name: matching
description: تطبيق عربي لمطابقة كشوفات العملاء والموردين والبنوك
publish_to: 'none'
version: 1.3.1+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.2.0
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.5.0
  csv: ^6.0.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  share_plus: ^11.0.0
  google_mobile_ads: ^9.0.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.2
  http: ^1.5.0
  pdf: ^3.11.3
  printing: ^5.14.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/samples/
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
