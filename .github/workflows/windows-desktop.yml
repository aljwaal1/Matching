name: Windows Desktop
on:
  workflow_dispatch:
  push:
    branches: [feature/windows-desktop]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows --project-name matching --no-pub .
      - name: Generate branded Windows icon
        shell: powershell
        run: .\tools\windows_icon.ps1
      - run: flutter pub get
      - run: flutter test
      - name: Build obfuscated Windows release
        run: flutter build windows --release --obfuscate --split-debug-info=build/private-symbols
      - name: Remove debug symbols from distributable
        shell: pwsh
        run: |
          Get-ChildItem build/windows/x64/runner/Release -Recurse -File -Include *.pdb,*.symbols,*.map | Remove-Item -Force
          if (Get-ChildItem build/windows/x64/runner/Release -Recurse -File -Include *.dart,*.pdb,*.symbols,*.map) { throw "Unexpected source or debug files in release" }
      - uses: actions/upload-artifact@v4
        with:
          name: Matching-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
